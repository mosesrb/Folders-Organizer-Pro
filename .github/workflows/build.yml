name: Build Folders Organizer Pro

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke-test that all services import
      # Guards against the class of bug where a service imports a package
      # that isn't listed in requirements.txt — this previously shipped
      # completely broken (media_service.py needed Pillow/pypdf/miniaudio,
      # none of which were declared as dependencies).
      run: |
        python -c "import services.file_service, services.organizer_service, services.duplicate_service, services.automation_service, services.media_service; print('All services import cleanly')"

    - name: Run test suite
      run: |
        python -m unittest tests.test_services -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
        
    - name: Install dependencies and build
      working-directory: ./ui
      run: |
        npm install
        npm run build
        
    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: ui-dist
        path: ui/dist
        retention-days: 1

  build-executable:
    needs: [build-frontend, test-backend]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: ui-dist
        path: ui/dist
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --name "Folders Organizer Pro" --noconsole --icon "icon.ico" --add-data "ui/dist;ui/dist" --add-data "services;services" organizer.py
        
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Folders Organizer Pro (Windows)
        path: dist/Folders Organizer Pro.exe
