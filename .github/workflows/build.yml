name: Build Folders Organizer Pro

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
        
    - name: Install dependencies and build
      working-directory: ./ui
      run: |
        npm install
        npm run build
        
    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: ui-dist
        path: ui/dist
        retention-days: 1

  build-executable:
    needs: build-frontend
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: ui-dist
        path: ui/dist
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --name "Folders Organizer Pro" --noconsole --icon "icon.ico" --add-data "ui/dist;ui/dist" --add-data "services;services" organizer.py
        
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Folders Organizer Pro (Windows)
        path: dist/Folders Organizer Pro.exe
